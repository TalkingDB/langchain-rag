services:
  neo4j:
    image: neo4j:2026.10.2
    container_name: neo4j-database
    restart: unless-stopped

    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}

    ports:
      - "7474:7474"

    volumes:
      - neo4j_data:/data

    networks:
      - docker
    healthcheck:
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  neo4j_data:

networks:
  docker: